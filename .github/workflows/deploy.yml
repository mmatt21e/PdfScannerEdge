name: Deploy PocketScan to GitHub Pages

# Builds the PWA and publishes it to GitHub Pages so it can be opened and installed
# from a phone. The Pages URL will be:  https://<owner>.github.io/<repo>/
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; new pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # BASE_PATH must match the Pages subpath (the repository name) so assets, the
        # web app manifest, and the service worker scope resolve correctly.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Add SPA + Jekyll bypass files
        # 404.html mirrors index.html so deep links resolve on refresh; .nojekyll stops
        # GitHub Pages from filtering files.
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Configure GitHub Pages
        # enablement: true turns Pages on automatically (source = GitHub Actions) so no
        # manual repository setting is required for the first deploy.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
